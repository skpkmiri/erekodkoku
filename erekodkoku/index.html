<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eKoku</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel & html2pdf -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- SheetJS untuk fungsi Eksport Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* CSS KHUSUS UNTUK CETAKAN A4 & PDF */
        @media print { 
            .print\:hidden { display: none !important; } 
            body { background: white !important; padding: 0 !important; margin: 0 !important; width: 210mm !important; } 
            @page { size: A4 portrait; margin: 10mm; }
            .break-inside-avoid { page-break-inside: avoid !important; break-inside: avoid !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            .single-page-print {
                width: 190mm !important; /* 210mm lebar A4 - 20mm margin kiri kanan */
                max-height: 277mm !important; /* 297mm tinggi A4 - 20mm margin atas bawah */
                overflow: hidden !important;
                box-sizing: border-box !important;
                padding: 0 !important;
                margin: auto !important;
            }
            .single-page-print table {
                font-size: 10px !important;
                line-height: 1.2 !important;
            }
            .single-page-print th, .single-page-print td {
                padding: 4px !important;
            }
        }
    </style>

    <script>
        window.Babel.registerPreset("react-classic", {
            presets: [[window.Babel.availablePresets["react"], { runtime: "classic" }]]
        });
    </script>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react-classic">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS COMPONENT ---
        const Icons = {
            School: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14v7"/></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
            FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
            Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
            Printer: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>,
            Excel: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        };

        // --- DATA MOCKUP (Sebagai Ganti Firebase untuk Preview Mandiri) ---
        const initialStudents = [
            { id: 'S1', name: 'CASSANDRA MARIA JEGA ANAK SEMALIE', act1: 'KELAB ICT', act2: 'BOLA JARING', act3: 'PENGAKAP' },
            { id: 'S2', name: 'DIONYSIUS DELROY ANAK RAYMOND', act1: 'KELAB ICT', act2: 'BOLA SEPAK', act3: 'TKRS' },
            { id: 'S3', name: 'IZZ DASUKI BIN ABDULLAH', act1: 'KELAB ICT', act2: 'BOLA SEPAK', act3: 'TKRS' },
            { id: 'S4', name: 'JOSELINE JONG SHI YING', act1: 'KELAB ICT', act2: 'BOLA JARING', act3: 'PENGAKAP' },
            { id: 'S5', name: 'MCLAIRE NYARINE ANAK STEPHEN', act1: 'KELAB ICT', act2: 'BOLA JARING', act3: 'PENGAKAP' },
            { id: 'S6', name: 'NUR AINA BINTI BAHARIM', act1: 'KELAB ICT', act2: 'BOLA JARING', act3: 'PENGAKAP' },
            { id: 'S7', name: 'SURAIYA KHAIRINA BINTI KHAIRUL', act1: 'KELAB ICT', act2: 'BOLA JARING', act3: 'PENGAKAP' },
            { id: 'S8', name: 'ZAIM ZAHRAN BIN ZAINUDDIN', act1: 'KELAB ICT', act2: 'BOLA SEPAK', act3: 'TKRS' }
        ];

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const d = new Date(dateString);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        };

        // --- KOMPONEN HEADER CETAKAN (REUSABLE) ---
        const PrintHeader = ({ title, date }) => (
            <div className="text-center mb-6 flex flex-col items-center border-b-2 border-slate-200 print:border-slate-800 pb-4">
                {/* Fallback jika logo.png tiada */}
                <div className="w-20 h-20 mb-2 bg-slate-200 rounded-full flex items-center justify-center print:border-2 print:border-slate-800">
                    <span className="text-xs font-bold text-slate-500">LOGO</span>
                </div>
                <h1 className="text-xl font-black uppercase tracking-widest text-slate-900">SK PENDIDIKAN KHAS MIRI</h1>
                <h2 className="text-sm font-bold uppercase mt-2 bg-slate-100 print:bg-transparent print:border-none px-4 py-1 rounded-full border border-slate-300 text-slate-800">
                    {title} {date ? `• ${formatDate(date)}` : ''}
                </h2>
            </div>
        );

        // --- KOMPONEN FOOTER CETAKAN (REUSABLE) ---
        const PrintFooter = () => (
            <div className="mt-8 pt-4 border-t-2 border-slate-800 text-center text-[10px] font-black uppercase text-slate-600 break-inside-avoid">
                UNIT KOKURIKULUM SK PENDIDIKAN KHAS MIRI
            </div>
        );

        // --- KOMPONEN UTAMA APLIKASI ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('analisis');
            const [students, setStudents] = useState(initialStudents);
            const [attendanceRecords, setAttendanceRecords] = useState([
                { id: 'A1', aktiviti: 'KELAB ICT', tarikh: '2026-06-15', records: { 'S1': true, 'S2': true, 'S3': true, 'S4': true, 'S5': false, 'S6': false, 'S7': true, 'S8': true } },
                { id: 'A2', aktiviti: 'KELAB ICT', tarikh: '2026-06-22', records: { 'S1': true, 'S2': true, 'S3': true, 'S4': true, 'S5': true, 'S6': false, 'S7': true, 'S8': false } }
            ]);
            const [reports, setReports] = useState([
                 { id: 'R1', unit: 'KELAB ICT', tarikh: '2026-06-15', masa: '14:00', tajuk: 'Pengenalan Asas Komputer', kekuatan: 'Semua murid fokus.', kelemahan: 'Kekurangan PC.', penambahbaikan: 'Bawa laptop sendiri.' }
            ]);

            // --- VIEW: ANALISIS & RUMUSAN ---
            const AnalisisView = () => {
                const [subTab, setSubTab] = useState('keseluruhan');
                const [selectedClub, setSelectedClub] = useState('KELAB ICT');
                const clubs = [...new Set(students.map(s => s.act1))];

                const generatePDF = (elementId, filename) => {
                    const el = document.getElementById(elementId);
                    el.classList.add('single-page-print');
                    const opt = { 
                        margin: 10, 
                        filename: `${filename}.pdf`, 
                        image: { type: 'jpeg', quality: 0.80 }, 
                        html2canvas: { scale: 2, useCORS: true, windowWidth: 1024 }, 
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true } 
                    };
                    html2pdf().from(el).set(opt).save().then(() => el.classList.remove('single-page-print'));
                };

                const printDocument = (elementId) => {
                    const el = document.getElementById(elementId);
                    el.classList.add('single-page-print');
                    window.print();
                    el.classList.remove('single-page-print');
                };

                // Pengiraan Analisis
                const clubStudents = students.filter(s => s.act1 === selectedClub || s.act2 === selectedClub || s.act3 === selectedClub);
                const relevantAttendance = attendanceRecords.filter(r => r.aktiviti === selectedClub);
                const studentStats = {};
                
                clubStudents.forEach(s => {
                    studentStats[s.id] = { hadir: 0, sesi: relevantAttendance.length };
                    relevantAttendance.forEach(r => { if (r.records[s.id]) studentStats[s.id].hadir++; });
                });

                const totalHadir = clubStudents.reduce((sum, s) => sum + studentStats[s.id].hadir, 0);
                const totalSesi = clubStudents.reduce((sum, s) => sum + studentStats[s.id].sesi, 0);
                const overallPercentage = totalSesi === 0 ? 0 : Math.round((totalHadir / (totalSesi)) * 100);

                // --- FUNGSI JANA EXCEL (Analisis Kelab) ---
                const downloadExcelKelab = () => {
                    const tableData = [
                        ["Bil", "Nama Murid", "Hadir", "Sesi", "Peratusan (%)"]
                    ];
                    clubStudents.forEach((s, idx) => {
                        const stat = studentStats[s.id];
                        const pct = stat.sesi === 0 ? 0 : Math.round((stat.hadir/stat.sesi)*100);
                        tableData.push([idx + 1, s.name, stat.hadir, stat.sesi, pct]);
                    });
                    tableData.push([]); // Baris kosong
                    tableData.push(["", "", `JUMLAH KESELURUHAN PERATUSAN ${selectedClub}:`, "", `${overallPercentage}%`]);

                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet(tableData);
                    ws['!cols'] = [{wch: 5}, {wch: 40}, {wch: 10}, {wch: 10}, {wch: 15}]; // Tetapkan lebar lajur
                    XLSX.utils.book_append_sheet(wb, ws, "Analisis Kelab");
                    XLSX.writeFile(wb, `Analisis_Kehadiran_${selectedClub.replace(/\s+/g, '_')}.xlsx`);
                };

                // --- FUNGSI JANA EXCEL (Rumusan Murid) ---
                const downloadExcelMurid = () => {
                    const tableData = [
                        ["Bil", "Nama Penuh Murid", "KELAB", "SUKAN", "BADAN UNIFORM"]
                    ];
                    students.forEach((s, idx) => {
                        tableData.push([idx + 1, s.name, s.act1 || '-', s.act2 || '-', s.act3 || '-']);
                    });

                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet(tableData);
                    ws['!cols'] = [{wch: 5}, {wch: 40}, {wch: 20}, {wch: 20}, {wch: 20}];
                    XLSX.utils.book_append_sheet(wb, ws, "Rumusan Murid");
                    XLSX.writeFile(wb, `Rumusan_Unit_Murid.xlsx`);
                };

                return (
                    <div className="space-y-6">
                        <div className="flex flex-wrap gap-2 print:hidden mb-6">
                            <button onClick={() => setSubTab('keseluruhan')} className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${subTab === 'keseluruhan' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-600 border'}`}>Analisis Sekolah</button>
                            <button onClick={() => setSubTab('kelab')} className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${subTab === 'kelab' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-600 border'}`}>Analisis Kelab</button>
                            <button onClick={() => setSubTab('murid')} className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${subTab === 'murid' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-600 border'}`}>Rumusan Murid</button>
                        </div>

                        {/* SUBTAB: ANALISIS SEKOLAH */}
                        {}
                        {subTab === 'keseluruhan' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-6 print:hidden">
                                    <h2 className="text-lg font-bold text-slate-800">Prestasi Keseluruhan Sekolah</h2>
                                    <div className="flex gap-2">
                                        <button onClick={() => generatePDF('print-keseluruhan', 'Analisis_Keseluruhan')} className="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Download/> Simpan PDF</button>
                                        <button onClick={() => printDocument('print-keseluruhan')} className="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Printer/> Cetak</button>
                                    </div>
                                </div>
                                <div id="print-keseluruhan" className="p-4">
                                    <PrintHeader title="ANALISIS KESELURUHAN KEHADIRAN KOKURIKULUM" />
                                    <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-8 text-center mb-8">
                                        <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-2">Purata Kehadiran Semasa</p>
                                        <p className="text-6xl font-black text-blue-600 mb-4">{overallPercentage}%</p>
                                        <p className="text-xs text-slate-500 max-w-md mx-auto">Purata Peratusan terkumpul kehadiran murid bagi keseluruhan kelab, sukan, dan badan uniform berdasarkan data yang direkodkan.</p>
                                    </div>
                                    <PrintFooter />
                                </div>
                            </div>
                        )}

                        {/* SUBTAB: ANALISIS KELAB */}
                        {}
                        {subTab === 'kelab' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 print:hidden">
                                    <select value={selectedClub} onChange={(e) => setSelectedClub(e.target.value)} className="w-full sm:w-auto p-2 border border-slate-300 rounded-lg bg-slate-50 text-slate-800 font-bold focus:ring-2 focus:ring-blue-500 outline-none">
                                        {clubs.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                    <div className="flex gap-2 w-full sm:w-auto">
                                        <button onClick={downloadExcelKelab} className="flex-1 sm:flex-none justify-center bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Excel/> Excel</button>
                                        <button onClick={() => generatePDF('print-kelab', `Analisis_${selectedClub.replace(/\s+/g, '_')}`)} className="flex-1 sm:flex-none justify-center bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Download/> Simpan PDF</button>
                                        <button onClick={() => printDocument('print-kelab')} className="flex-1 sm:flex-none justify-center bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Printer/> Cetak</button>
                                    </div>
                                </div>
                                <div id="print-kelab" className="p-4">
                                    <PrintHeader title={`ANALISIS KEHADIRAN ${selectedClub}`} />
                                    <table className="w-full text-sm text-left border-collapse border-2 border-slate-800 mb-6">
                                        <thead className="bg-slate-100">
                                            <tr>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black text-center w-12">Bil</th>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black">Nama Murid</th>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black text-center w-24">Hadir/Sesi</th>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black text-center w-24">%</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {clubStudents.map((s, idx) => {
                                                const stat = studentStats[s.id];
                                                const pct = stat.sesi === 0 ? 0 : Math.round((stat.hadir/stat.sesi)*100);
                                                return (
                                                    <tr key={s.id} className="hover:bg-slate-50">
                                                        <td className="p-2 border-2 border-slate-800 text-center font-medium text-slate-600">{idx+1}</td>
                                                        <td className="p-2 border-2 border-slate-800 font-bold uppercase text-slate-800">{s.name}</td>
                                                        <td className="p-2 border-2 border-slate-800 text-center text-slate-600">{stat.hadir} / {stat.sesi}</td>
                                                        <td className="p-2 border-2 border-slate-800 text-center font-bold">
                                                            <span className={`px-2 py-1 rounded ${pct >= 80 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{pct}%</span>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                            {/* Baris Jumlah Keseluruhan Kelab */}
                                            <tr className="bg-slate-100">
                                                <td colSpan="3" className="p-2 border-2 border-slate-800 text-right font-black uppercase tracking-wider text-slate-800">JUMLAH KESELURUHAN PERATUSAN {selectedClub}:</td>
                                                <td className="p-2 border-2 border-slate-800 text-center font-black">
                                                    <span className={`px-2 py-1 rounded ${overallPercentage >= 80 ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}`}>{overallPercentage}%</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <PrintFooter />
                                </div>
                            </div>
                        )}

                        {/* SUBTAB: RUMUSAN MURID */}
                        {}
                        {subTab === 'murid' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-6 print:hidden">
                                    <h2 className="text-lg font-bold text-slate-800">Pendaftaran & Unit Murid</h2>
                                    <div className="flex gap-2">
                                        <button onClick={downloadExcelMurid} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Excel/> Excel</button>
                                        <button onClick={() => generatePDF('print-murid', 'Senarai_Unit_Murid')} className="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Download/> Simpan PDF</button>
                                        <button onClick={() => printDocument('print-murid')} className="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Printer/> Cetak</button>
                                    </div>
                                </div>
                                <div id="print-murid" className="p-4">
                                    <PrintHeader title="RUMUSAN PENDAFTARAN UNIT KOKURIKULUM MURID" />
                                    <table className="w-full text-xs text-left border-collapse border-2 border-slate-800 mb-6">
                                        <thead className="bg-slate-100">
                                            <tr>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black text-center w-10">Bil</th>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black w-1/3">Nama Penuh Murid</th>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black text-center">KELAB</th>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black text-center">SUKAN</th>
                                                <th className="p-2 border-2 border-slate-800 uppercase font-black text-center">BADAN UNIFORM</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {students.map((s, idx) => (
                                                <tr key={s.id} className="hover:bg-slate-50">
                                                    <td className="p-2 border-2 border-slate-800 text-center font-medium">{idx + 1}</td>
                                                    <td className="p-2 border-2 border-slate-800 font-bold uppercase">{s.name}</td>
                                                    <td className="p-2 border-2 border-slate-800 text-center uppercase text-slate-600">{s.act1 || '-'}</td>
                                                    <td className="p-2 border-2 border-slate-800 text-center uppercase text-slate-600">{s.act2 || '-'}</td>
                                                    <td className="p-2 border-2 border-slate-800 text-center uppercase text-slate-600">{s.act3 || '-'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <PrintFooter />
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- MAIN RENDER ---
            return (
                <div className="min-h-screen flex flex-col relative bg-slate-50">
                    {/* Header Penuh Aplikasi */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 print:hidden shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-3">
                                    <div className="bg-blue-600 text-white p-2 rounded-lg shadow">
                                        <Icons.School />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-black text-slate-800 leading-tight tracking-tight">eKoku</h1>
                                        <p className="text-[10px] sm:text-xs text-slate-500 font-bold uppercase tracking-wider">Sistem Pengurusan Kokurikulum</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigasi Utama */}
                    <div className="bg-white border-b border-slate-200 print:hidden overflow-x-auto">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex space-x-8 min-w-max">
                                {[
                                    { id: 'analisis', label: 'Analisis & Cetakan', icon: Icons.Chart },
                                    { id: 'kehadiran', label: 'Rekod Kehadiran', icon: Icons.Users },
                                    { id: 'laporan', label: 'Laporan Aktiviti', icon: Icons.FileText }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 py-4 px-2 border-b-2 font-bold text-sm transition-colors whitespace-nowrap ${
                                            activeTab === tab.id 
                                            ? 'border-blue-600 text-blue-600' 
                                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                        }`}
                                    >
                                        <tab.icon /> {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Kandungan Tab Dinamik */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        {activeTab === 'analisis' && <AnalisisView />}
                        {activeTab === 'kehadiran' && (
                            <div className="bg-white p-6 rounded-2xl border shadow-sm text-center py-20 text-slate-500 font-medium">
                                <Icons.Users className="w-16 h-16 mx-auto mb-4 text-slate-300" />
                                Modul Kehadiran (Paparan Ringkas dalam demo)
                                <p className="text-sm mt-2">Sila gunakan tab "Analisis & Cetakan" untuk melihat data sebenar.</p>
                            </div>
                        )}
                        {activeTab === 'laporan' && (
                            <div className="bg-white p-6 rounded-2xl border shadow-sm text-center py-20 text-slate-500 font-medium">
                                <Icons.FileText className="w-16 h-16 mx-auto mb-4 text-slate-300" />
                                Modul Laporan (Paparan Ringkas dalam demo)
                                <p className="text-sm mt-2">Sila gunakan tab "Analisis & Cetakan" untuk melihat data sebenar.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // Render aplikasi ke DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
